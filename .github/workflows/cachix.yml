---
name: package cache
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  prepare-matrix:
    name: Check Cache
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'tack: update inputs')
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = pipe-operators
      - name: Filter uncached packages
        id: set-matrix
        run: |
          PACKAGES=(
            "yazi"
            "cliphist"
            "cliphist-tui"
            "amdgpu_top"
            "loupe"
            "lan-mouse"
            "quickshell"
            "hyprland-bundle"
          )
          MISSING=()
          for pkg in "${PACKAGES[@]}"; do
            if STORE_PATH=$(nix eval --raw ".#packages.x86_64-linux.$pkg.outPath"); then
              if ! nix path-info --store https://onelock.cachix.org "$STORE_PATH" >/dev/null 2>&1; then
                MISSING+=("$pkg")
              fi
            else
              echo "::error::Evaluation failed for package: $pkg"
              exit 1
            fi
          done
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "All packages are cached."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            JSON_ARRAY="$(printf '%s\n' "${MISSING[@]}" | jq -R . | jq -s -c .)"
            echo "matrix=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          fi
  build-packages:
    name: Build ${{ matrix.package }}
    needs: prepare-matrix
    if: >-
      needs.prepare-matrix.result == 'success' &&
      needs.prepare-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = pipe-operators
      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: onelock
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build and push ${{ matrix.package }}
        run: |-
          nix build ".#packages.x86_64-linux.${{ matrix.package }}" \
            --print-out-paths --print-build-logs \
            | cachix push onelock
      - name: Record Build Status
        if: always()
        run: echo "${{ job.status }}" > "status-${{ matrix.package }}.txt"
      - name: Upload Build Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.package }}
          path: status-${{ matrix.package }}.txt
          retention-days: 1
  notify:
    name: Notify Discord
    needs: build-packages
    if: always() && needs.build-packages.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Statuses
        uses: actions/download-artifact@v4
        with:
          pattern: status-*
          merge-multiple: true
      - name: Generate Summary
        id: summary
        run: |
          DESCRIPTION=""
          for file in status-*.txt; do
            [ -e "$file" ] || continue
            PACKAGE="${file#status-}"
            PACKAGE="${PACKAGE%.txt}"
            STATUS="$(cat "$file")"
            if [ "$STATUS" = "success" ] || [ "$STATUS" = "Success" ]; then
              DESCRIPTION+="✅ $PACKAGE\n"
            else
              DESCRIPTION+="❌ $PACKAGE\n"
            fi
          done
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "description<<$EOF" >> "$GITHUB_OUTPUT"
          echo -e "$DESCRIPTION" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"
      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          username: GitHub Workflow
          avatar_url: ${{ secrets.AVATAR_URL }}
          status: ${{ needs.build-packages.result }}
          title: Build and cache packages
          description: ${{ steps.summary.outputs.description }}
          content: look at this shi ${{ secrets.DISCORD_USER}}
          notimestamp: true
